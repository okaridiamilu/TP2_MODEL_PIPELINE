name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13", "3.14"]

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Installer les dependances
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lancer le linter
        run: ruff check .

      # pytest lance la couverture automatiquement (config pyproject)
      # et ECHOUE si la couverture descend sous 80%
      - name: Lancer les tests avec couverture
        run: python -m pytest
